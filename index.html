<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Situs pribadi Katca1 di GitHub Pages.">
  <title>Halo, dunia! — Katca1</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top right, #dbeafe, transparent 38%), #f8fafc;
    }
    main {
      width: min(100%, 640px);
      padding: clamp(32px, 8vw, 64px);
      text-align: center;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 24px 60px rgb(15 23 42 / 8%);
    }
    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: .875rem;
      font-weight: 600;
    }
    h1 { margin: 0; font-size: clamp(2.25rem, 8vw, 4rem); letter-spacing: -.05em; }
    p { margin: 16px 0 28px; color: #475569; font-size: 1.125rem; line-height: 1.7; }
    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #1d4ed8; }
    a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Situs GitHub Pages</span>
    <h1>Halo, dunia! 👋</h1>
    <p>Selamat datang di situs sederhana saya. Halaman ini dibuat dari awal dan siap dikembangkan lagi.</p>
    <a href="https://github.com/Katca1">Lihat GitHub saya</a>
  </main>
</body>
</html>
